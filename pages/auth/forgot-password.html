<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — UniBolt ERP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/animations.css" />
  <style>
    .auth-wrapper { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .auth-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:var(--radius-2xl); padding:2.5rem; width:100%; max-width:420px; box-shadow:var(--shadow-xl); }
    .auth-logo { display:flex;align-items:center;gap:0.75rem;justify-content:center;margin-bottom:2rem;text-decoration:none; }
    .auth-logo-icon { width:44px;height:44px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem; }
    .auth-logo-text { font-size:1.25rem;font-weight:800;color:var(--text-primary); }
    .auth-logo-text span { color:#818cf8; }
    .back-link { display:flex;align-items:center;gap:0.5rem;color:var(--text-muted);font-size:0.875rem;margin-bottom:1.5rem;text-decoration:none; }
    .back-link:hover { color:var(--text-primary); }
    .success-state { text-align:center;padding:2rem 0; }
    .success-icon { font-size:3rem;margin-bottom:1rem; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card animate-scale-in">
      <a href="../../index.html" class="auth-logo">
        <div class="auth-logo-icon">⚡</div>
        <span class="auth-logo-text">Uni<span>Bolt</span></span>
      </a>

      <a href="login.html" class="back-link">← Back to Sign In</a>

      <div id="formState">
        <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;">Reset Password</h1>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:2rem;">Enter your email address and we'll send you a link to reset your password.</p>

        <div id="resetAlert" class="alert alert-danger hidden" style="margin-bottom:1rem;"></div>

        <form id="resetForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="resetEmail">Email Address</label>
            <div class="input-group">
              <span class="input-group-icon">✉️</span>
              <input type="email" id="resetEmail" name="email" class="form-control" placeholder="your@university.edu" required />
            </div>
            <div class="form-error" data-error="email"></div>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="resetBtn" style="height:44px;">
            Send Reset Link →
          </button>
        </form>
      </div>

      <div id="successState" class="success-state hidden">
        <div class="success-icon">📬</div>
        <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:0.5rem;">Check your inbox!</h2>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1.5rem;">We've sent a password reset link to <strong id="sentEmail" style="color:var(--text-primary);"></strong>. Check your spam folder if you don't see it.</p>
        <a href="login.html" class="btn btn-primary">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const alertEl = document.getElementById('resetAlert');
      alertEl.classList.add('hidden');

      if (!email) { alertEl.textContent = 'Please enter your email address.'; alertEl.classList.remove('hidden'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alertEl.textContent = 'Please enter a valid email.'; alertEl.classList.remove('hidden'); return; }

      const btn = document.getElementById('resetBtn');
      btn.disabled = true; btn.innerHTML = '⏳ Sending…';

      try {
        await auth.sendPasswordResetEmail(email);
        document.getElementById('sentEmail').textContent = email;
        document.getElementById('formState').classList.add('hidden');
        document.getElementById('successState').classList.remove('hidden');
      } catch (err) {
        btn.disabled = false; btn.innerHTML = 'Send Reset Link →';
        const messages = {
          'auth/user-not-found': 'No account found with this email.',
          'auth/invalid-email': 'Please enter a valid email address.',
          'auth/too-many-requests': 'Too many requests. Please wait.',
        };
        alertEl.textContent = messages[err.code] || 'Failed to send reset email.';
        alertEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
