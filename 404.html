<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | UniBolt ERP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
    .err-code { font-size:8rem; font-weight:800; background:linear-gradient(135deg,#6366f1,#8b5cf6,#0ea5e9); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
    .err-title { font-size:2rem; font-weight:700; margin:1rem 0 0.5rem; }
    .err-sub { color:#64748b; margin-bottom:2rem; max-width:400px; }
  </style>
</head>
<body>
  <div class="animate-fade-in-up">
    <div style="font-size:4rem;margin-bottom:1rem;animation:float 3s ease-in-out infinite;">🔍</div>
    <div class="err-code">404</div>
    <h1 class="err-title">Page Not Found</h1>
    <p class="err-sub">The page you are looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" class="btn btn-primary">🏠 Go Home</a>
      <a href="dashboard.html" class="btn btn-secondary">📊 Dashboard</a>
      <button onclick="history.back()" class="btn btn-outline">← Go Back</button>
    </div>
  </div>
</body>
</html>
